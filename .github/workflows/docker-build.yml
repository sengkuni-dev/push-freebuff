name: Build Docker Image (GHCR) from trefeon/freebuff-proxy

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:       # manual trigger → always build

permissions:
  contents: read
  packages: write

env:
  SOURCE_REPO: trefeon/freebuff-proxy
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: source-repo
          fetch-depth: 1

      - name: Get latest commit SHA from source repo
        id: source-sha
        working-directory: ./source-repo
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # Restore cached SHA from previous run
      - name: Restore cached SHA
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .sha-cache
          key: source-sha-${{ steps.source-sha.outputs.sha }}
          restore-keys: |
            source-sha-

      - name: Check if version updated
        id: version-check
        run: |
          CACHE_FILE=".sha-cache/last-sha.txt"
          NEW_SHA="${{ steps.source-sha.outputs.sha }}"
          IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"

          if [ "$IS_MANUAL" = "true" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - always build"
            mkdir -p .sha-cache
            echo "$NEW_SHA" > "$CACHE_FILE"
            exit 0
          fi

          if [ ! -f "$CACHE_FILE" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "first-run=true" >> $GITHUB_OUTPUT
            echo "No cache file found - first run"
            mkdir -p .sha-cache
            echo "$NEW_SHA" > "$CACHE_FILE"
          else
            OLD_SHA=$(cat "$CACHE_FILE")
            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              echo "updated=true" >> $GITHUB_OUTPUT
              echo "Version updated! $OLD_SHA -> $NEW_SHA"
              echo "$NEW_SHA" > "$CACHE_FILE"
            else
              echo "updated=false" >> $GITHUB_OUTPUT
              echo "Version unchanged: $OLD_SHA"
            fi
          fi

      - name: Skip if no updates
        if: steps.version-check.outputs.updated == 'false'
        run: echo "✅ No updates detected. Skipping Docker build."

      - name: Set up Docker Buildx
        if: steps.version-check.outputs.updated == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.version-check.outputs.updated == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.version-check.outputs.updated == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.source-sha.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: steps.version-check.outputs.updated == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./source-repo
          file: ./source-repo/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.source-sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save SHA cache
        if: steps.version-check.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sha-cache
          key: source-sha-${{ steps.source-sha.outputs.sha }}

      - name: Notify completion
        if: always()
        run: |
          if [ "${{ steps.version-check.outputs.updated }}" == "true" ]; then
            echo "🚀 Docker image built and pushed successfully!"
            echo "SHA: ${{ steps.source-sha.outputs.sha }}"
            echo "Tags: ${{ steps.meta.outputs.tags }}"
          else
            echo "⏭️ Skipped - No changes detected in upstream repo"
          fi
